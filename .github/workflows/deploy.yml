name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refreshes MIMIT price data daily even with no code changes. 08:00 UTC covers MIMIT's
    # 8am (CET/CEST) daily extract with margin either side of DST.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run fetch-data
      - run: npm run build
        env:
          # Repository variables (Settings -> Secrets and variables -> Actions -> Variables),
          # not secrets — the anon key is meant to be public, access is controlled by RLS
          # (supabase/schema.sql). Baked in at build time like every other VITE_* var.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
